name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # directory globs rather than a hand-kept list, so a new script in
      # src/ or tools/ is covered without touching this file
      - name: Shell syntax check
        run: |
          set -e
          for f in install.sh src/*.sh tools/*.sh tools/adjust-scripts-s6-sh dev/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Python syntax check
        run: |
          set -e
          for f in src/*.py tools/*.py; do
            echo "checking $f"
            python3 -m py_compile "$f"
          done
